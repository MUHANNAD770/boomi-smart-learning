#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-l i{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-weight:800;font-size:var(--s);color:var(--c);text-shadow:0 0 18px var(--c);opacity:0;transform:rotate(var(--r)) scale(.3);animation:spIn .7s var(--d) cubic-bezier(.2,1.6,.4,1) forwards,spFl 3.2s calc(var(--d) + .7s) ease-in-out infinite alternate}
@keyframes spIn{to{opacity:.9;transform:rotate(var(--r)) scale(1)}}
@keyframes spFl{to{transform:rotate(calc(var(--r) * -1)) translateY(-14px) scale(1.08);opacity:.55}}
.sp-c{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px}
.sp-o{width:min(58vw,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid rgba(255,255,255,.85);box-shadow:0 0 0 10px rgba(255,213,74,.18),0 0 60px rgba(124,200,255,.55);animation:spPop .8s cubic-bezier(.2,1.5,.4,1) both,spBob 2.4s .8s ease-in-out infinite}
.sp-o img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes spPop{from{transform:scale(0) rotate(-12deg)}}
@keyframes spBob{50%{transform:translateY(-10px) rotate(2deg)}}
.sp-t{margin:14px 0 0;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.3;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sp-t b{display:inline-block;opacity:0;transform:translateY(16px);animation:spW .5s var(--d) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes spW{to{opacity:1;transform:none}}
.sp-s{margin:0;font-weight:800;color:#ffd54a;opacity:0;animation:spW .5s 1.1s forwards}
.sp-b{width:min(52vw,220px);height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:16px}
.sp-b i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd54a,#6fe08a,#7cc8ff);animation:spBar 1.8s .2s ease-out forwards}
@keyframes spBar{to{width:100%}}
@media(prefers-reduced-motion:reduce){.sp-l i,.sp-o,.sp-t b,.sp-s,.sp-b i{animation:none;opacity:.9;transform:none}.sp-b i{width:100%}}
